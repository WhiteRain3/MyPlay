<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=412">
<title>MyPlay — State — first run (Setup, step 1 of 4)</title>
<style>
/* MyPlay phone app: design tokens and components (dark only).
   A sibling of ORBIT: rounds, rings, calm glass, one accent per tab (ORBIT's world colours). */

:root {
  /* Surfaces */
  --bg: #0A1015;          /* page */
  --surface: #121A21;     /* cards ("glass") */
  --surface2: #1A242D;    /* raised: icon discs, segmented, sheet rows */
  --sheet: #151E26;       /* bottom sheet */
  --edge: rgba(255, 255, 255, 0.07);
  --edge2: rgba(255, 255, 255, 0.14);
  --track: #2A3540;
  /* Text */
  --text: #EEF1F7;        /* 16.6:1 on bg */
  --text2: #AAB3C8;       /* 8.9:1 on bg */
  --text3: #8A95A8;       /* 5.9:1 on bg, 5.5:1 on surface */
  /* Signals */
  --warn: #FF7A7A;
  --caution: #FFC857;
  --ok: #6EE7A8;
  --on: #0A1015;          /* text on any accent fill */
  /* Accent per tab: ORBIT's night world colours */
  --a-home: #6EE7A8;      /* Navigate */
  --a-screen: #A78BFA;    /* Music */
  --a-car: #FFC24A;       /* Car */
  --a-apps: #FF8FB1;      /* Apps */
  --a-more: #9DB4E8;      /* Settings */
  --acc: var(--a-home);
  --acc-soft: color-mix(in srgb, var(--acc) 14%, transparent);
  --acc-line: color-mix(in srgb, var(--acc) 55%, transparent);
  /* Shape and space (4 dp grid) */
  --r-card: 24px;
  --r-pill: 999px;
  --gutter: 16px;
}
.t-home { --acc: var(--a-home); }
.t-screen { --acc: var(--a-screen); }
.t-car { --acc: var(--a-car); }
.t-apps { --acc: var(--a-apps); }
.t-more { --acc: var(--a-more); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); }
body {
  font-family: Inter, system-ui, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss03";
}
svg.i { display: block; flex: none; }

/* ---------- Phone frame (412 x 915 dp) ---------- */
.phone {
  position: relative; width: 412px; height: 915px; overflow: hidden;
  background:
    radial-gradient(130% 42% at 50% -8%, color-mix(in srgb, var(--acc) 11%, transparent), transparent 70%),
    var(--bg);
}
.status {
  height: 36px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
  font-size: 14px; font-weight: 600; color: var(--text);
}
.status .sys { display: flex; gap: 6px; align-items: center; color: var(--text); }
.content { position: absolute; top: 36px; left: 0; right: 0; bottom: 96px; overflow: hidden; }
.content.full { bottom: 24px; }
.navhandle { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; display: flex; justify-content: center; align-items: center; }
.navhandle::after { content: ""; width: 108px; height: 4px; border-radius: 2px; background: rgba(238, 241, 247, 0.55); }

/* ---------- Top bars ---------- */
.top { height: 72px; padding: 0 8px 0 20px; display: flex; align-items: center; gap: 8px; }
.top h1 { font-size: 30px; font-weight: 650; letter-spacing: -0.6px; flex: 1; }
.top.sub { padding-left: 4px; height: 64px; }
.top.sub h1 { font-size: 22px; font-weight: 620; letter-spacing: -0.3px; }
.iconbtn {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--text2); flex: none;
}
.iconbtn.filled { background: var(--surface); border: 1px solid var(--edge); }
.wordmark { display: flex; align-items: center; gap: 10px; flex: 1; font-size: 20px; font-weight: 650; letter-spacing: -0.3px; }

/* ---------- Layout helpers ---------- */
.pad { padding: 0 var(--gutter); }
.stack > * + * { margin-top: 12px; }
.sec { font-size: 13px; font-weight: 600; color: var(--text2); letter-spacing: 0.2px; padding: 20px 20px 8px; }
.sec.first { padding-top: 4px; }
.note { font-size: 13px; color: var(--text3); padding: 10px 20px 0; line-height: 18px; display: flex; gap: 8px; align-items: center; }
.center { text-align: center; }

/* ---------- Card and row ---------- */
.card { background: var(--surface); border: 1px solid var(--edge); border-radius: var(--r-card); overflow: hidden; }
.card.glass { background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(12px); }
.card.acc { border-color: var(--acc-line); background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 9%, var(--surface)), var(--surface)); }
.row { min-height: 64px; padding: 10px 16px; display: flex; align-items: center; gap: 14px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 70px; right: 0; height: 1px; background: var(--edge); }
.row.noicon + .row.noicon::before, .row.noicon + .row::before { left: 16px; }
.row.tall { min-height: 72px; }
.row.dim { opacity: 0.42; }
.ic {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--acc-soft); color: var(--acc);
}
.ic.plain { background: var(--surface2); color: var(--text2); }
.ic.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.ic.app { color: var(--on); font-weight: 700; font-size: 15px; }
.lbl { flex: 1; min-width: 0; }
.lbl .l { font-size: 16px; font-weight: 520; line-height: 22px; display: flex; align-items: center; gap: 8px; }
.lbl .h { font-size: 13px; color: var(--text3); line-height: 18px; margin-top: 2px; }
.val { font-size: 14px; color: var(--text2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.chev { color: var(--text3); }
.changed { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); display: inline-block; flex: none; }
.link { color: var(--acc); }

/* Tags */
.tag {
  display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--r-pill);
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.1px; white-space: nowrap;
  background: color-mix(in srgb, var(--caution) 14%, transparent); color: var(--caution);
}
.tag.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.tag.mute { background: var(--surface2); color: var(--text2); }
.tag.acc { background: var(--acc-soft); color: var(--acc); }
.tag.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }

/* ---------- Controls ---------- */
.sw { width: 52px; height: 32px; border-radius: 16px; position: relative; flex: none; background: var(--track); border: 2px solid #4A5666; }
.sw::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--text3); top: 6px; left: 6px; }
.sw.on { background: var(--acc); border-color: var(--acc); }
.sw.on::after { width: 24px; height: 24px; top: 2px; left: 22px; background: var(--on); }

.btn {
  height: 52px; border-radius: var(--r-pill); padding: 0 24px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 16px; font-weight: 620; letter-spacing: -0.1px; white-space: nowrap;
}
.btn.primary { background: var(--acc); color: var(--on); }
.btn.ghost { border: 1.5px solid var(--edge2); color: var(--text); }
.btn.text { color: var(--acc); padding: 0 12px; }
.btn.small { height: 40px; padding: 0 16px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn.danger { color: var(--warn); }
.btn.disabled { background: var(--surface2); color: var(--text3); }
.btns { display: flex; gap: 12px; }
.btns > .btn { flex: 1; }

.seg { display: flex; background: var(--surface2); border-radius: var(--r-pill); padding: 4px; height: 48px; }
.seg > div { flex: 1; border-radius: var(--r-pill); display: grid; place-items: center; font-size: 14px; font-weight: 560; color: var(--text2); }
.seg > div.on { background: var(--acc); color: var(--on); font-weight: 650; }

.slider { padding: 6px 16px 14px; }
.slider .head { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0 14px; }
.slider .head .l { font-size: 16px; font-weight: 520; display: flex; gap: 8px; align-items: center; }
.slider .head .v { font-size: 14px; color: var(--acc); font-weight: 600; }
.slider .track { position: relative; height: 4px; border-radius: 2px; background: var(--track); margin: 0 12px; }
.slider .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--acc); }
.slider .thumb { position: absolute; top: -12px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; border: 3px solid var(--acc); background: var(--bg); box-shadow: 0 0 0 6px var(--acc-soft); }
.slider .ticks { position: absolute; left: 0; right: 0; top: -1px; display: flex; justify-content: space-between; }
.slider .ticks i { width: 6px; height: 6px; border-radius: 50%; background: #3A4652; margin-top: 0; }
.slider .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--text3); padding: 14px 0 0; }

/* Discs (swatches, choices) */
.discs { display: flex; gap: 14px; padding: 8px 16px 16px; flex-wrap: wrap; }
.disc { width: 48px; height: 48px; border-radius: 50%; position: relative; flex: none; }
.disc.sel { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--text); }
.disc-l { font-size: 12px; color: var(--text2); text-align: center; margin-top: 8px; }

/* ---------- Tab bar ---------- */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 24px; height: 72px; display: flex;
  background: rgba(13, 19, 25, 0.94); border-top: 1px solid var(--edge); backdrop-filter: blur(16px);
}
.tabbar .tb { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text2); position: relative; }
.tabbar .tb .ring { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.tabbar .tb.on .ring { border: 2px solid var(--acc); background: var(--acc-soft); color: var(--acc); }
.tabbar .tb span { font-size: 12px; font-weight: 520; color: var(--text3); }
.tabbar .tb.on span { color: var(--text); font-weight: 650; }
.tabbar .tb.home-tab { --acc: var(--a-home); }
.tabbar .tb.screen-tab { --acc: var(--a-screen); }
.tabbar .tb.car-tab { --acc: var(--a-car); }
.tabbar .tb.apps-tab { --acc: var(--a-apps); }
.tabbar .tb.more-tab { --acc: var(--a-more); }
.badge { position: absolute; top: 2px; right: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--caution); box-shadow: 0 0 0 2px #0D1319; }

/* ---------- Sheet and scrim ---------- */
.scrim { position: absolute; inset: 0; background: rgba(3, 6, 9, 0.66); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet);
  border-radius: 28px 28px 0 0; border-top: 1px solid var(--edge2); padding: 12px 20px 40px;
}
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: #3A4652; margin: 0 auto 18px; }
.sheet h2 { font-size: 22px; font-weight: 640; letter-spacing: -0.3px; }
.sheet .sub { font-size: 14px; color: var(--text2); margin-top: 6px; }
.sheet .card { background: var(--surface2); }

.snack {
  position: absolute; left: 16px; right: 16px; bottom: 112px; height: 52px; border-radius: 16px;
  background: #E6EAF2; color: #0A1015; display: flex; align-items: center; padding: 0 8px 0 18px; font-size: 14px; font-weight: 520;
}
.snack b { margin-left: auto; color: #3A2C8A; font-weight: 700; padding: 0 12px; }

/* ---------- Hero ring ---------- */
.hero { display: flex; flex-direction: column; align-items: center; padding: 8px 0 4px; }
.hero .t { font-size: 24px; font-weight: 650; letter-spacing: -0.4px; margin-top: 14px; }
.hero .s { font-size: 15px; color: var(--text2); margin-top: 4px; }

/* Car picture */
.pic { border-radius: 20px; overflow: hidden; border: 1px solid var(--edge); display: block; }
.picwrap { position: relative; }
.piccap { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px 0; }

/* Lists of apps */
.appdot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--on); flex: none; }

body { width: 412px; }

</style></head><body>
