# MyPlay: publishes a GitHub release when myplay-version.txt names a version that has no release yet.
#
# It runs on every push to the MyPlay branch and does nothing unless the version in
# myplay-version.txt is new. The version 0.0.0 means "not released yet" and never publishes.
# A release is tagged myplay-v<version> and holds:
#   - MyPlay-<version>.apk             the Android app, signed with the owner's key
#   - myplay-headunit-<version>.zip    the desktop test head unit
#   - SHA256SUMS
#
# The APK is signed with the key in these repository secrets:
# MYPLAY_KEYSTORE_BASE64 (base64 of the keystore file), MYPLAY_KEYSTORE_PASSWORD, MYPLAY_KEY_ALIAS,
# MYPLAY_KEY_PASSWORD. If any of them is missing the run fails. It never falls back to a debug key:
# on GitHub's machines that key is new on every run, so such a release could not be installed over
# the one before.
#
# AARE_PHONE_CERT / AARE_PHONE_KEY (see app/build.gradle.kts) are deliberately not passed: MyPlay
# releases carry no built-in phone certificate, and the app makes its own on first start.
name: MyPlay release

on:
  push:
    branches: [claude/myplay]
  # By hand from the Actions page: does the same, for a run that failed for an outside reason.
  workflow_dispatch:

permissions:
  contents: read

# One release build at a time, and a running one is never cancelled half way.
concurrency:
  group: myplay-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    # Only in the MyPlay repository itself, never in a copy of it.
    if: github.repository == 'WhiteRain3/MyPlay'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Version from myplay-version.txt
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < myplay-version.txt)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::myplay-version.txt must hold a version like 1.2.3, found '$VERSION'"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          TAG="myplay-v$VERSION"
          {
            echo "VERSION=$VERSION"
            echo "VERSION_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))"
            echo "TAG=$TAG"
          } >> "$GITHUB_ENV"
          if [ "$VERSION" = "0.0.0" ]; then
            echo "::notice::Version 0.0.0 means not released yet: nothing to publish"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists: nothing to publish"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "::notice::Release $TAG does not exist yet: building it"
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Signing secrets are present
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MYPLAY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MYPLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYPLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYPLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "$KEYSTORE_BASE64" ] || MISSING="$MISSING MYPLAY_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || MISSING="$MISSING MYPLAY_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || MISSING="$MISSING MYPLAY_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || MISSING="$MISSING MYPLAY_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Cannot release: these repository secrets are missing:$MISSING. No debug-signed release is made instead."
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: env.PUBLISH == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        if: env.PUBLISH == 'true'

      - name: Protocol, app and head unit tests
        if: env.PUBLISH == 'true'
        run: ./gradlew --no-daemon :aap:test :app:testDebugUnitTest :headunit:test

      # app/build.gradle.kts reads the key from AARE_KEYSTORE (a file path), AARE_KEYSTORE_PASSWORD,
      # AARE_KEY_ALIAS and AARE_KEY_PASSWORD, so the MyPlay secrets are handed over under those names.
      - name: Signed release APK
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MYPLAY_KEYSTORE_BASE64 }}
          AARE_KEYSTORE_PASSWORD: ${{ secrets.MYPLAY_KEYSTORE_PASSWORD }}
          AARE_KEY_ALIAS: ${{ secrets.MYPLAY_KEY_ALIAS }}
          AARE_KEY_PASSWORD: ${{ secrets.MYPLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export AARE_KEYSTORE="$RUNNER_TEMP/myplay-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$AARE_KEYSTORE"
          trap 'rm -f "$AARE_KEYSTORE"' EXIT
          ./gradlew --no-daemon :app:assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK at $APK (an unsigned one means the signing key was not used)"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          mkdir -p out
          cp "$APK" "out/MyPlay-$VERSION.apk"

      - name: The APK is signed, and not with a debug key
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "out/MyPlay-$VERSION.apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with a debug key"
            exit 1
          fi

      - name: Desktop head unit
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :headunit:installDist
          (cd headunit/build/install && zip -qr "$GITHUB_WORKSPACE/out/myplay-headunit-$VERSION.zip" aare-headunit)

      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          # Asked again just before publishing, in case another run published in the meantime.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG appeared while this run was building: not publishing again"
            exit 0
          fi
          cd out
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<NOTES
          MyPlay is a personal fork of [AARE](https://github.com/prototux/AARE) by prototux and contributors, under the same licence (GPL-3.0-or-later). It is not AARE and not Android Auto.

          Source code of this release: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA

          | File | What |
          |---|---|
          | \`MyPlay-$VERSION.apk\` | the Android app, signed with MyPlay's release key: open it on the phone, or \`adb install -r MyPlay-$VERSION.apk\` |
          | \`myplay-headunit-$VERSION.zip\` | the desktop test head unit, to try MyPlay without a car (needs Java 17 or newer, ffmpeg and adb) |
          | \`SHA256SUMS\` | checksums |
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MyPlay $VERSION" --notes-file ../notes.md --latest -- *
