# MyPlay (plan N19): builds the speed limit file for Lithuania from OpenStreetMap once a month and
# puts it on the "speed-limits" release, where the phone app downloads it (Settings, Speed limits).
#
# The file is a database derived from OpenStreetMap, so it is under the Open Database Licence
# (ODbL 1.0) like the data it comes from; the release says so. The release is never marked as the
# latest one (the app's update check reads the latest release), and it is a prerelease for the same
# reason.
#
# The same file is on main (for the monthly schedule, which GitHub runs from the default branch
# only) and on claude/myplay. main holds upstream AARE's code, not MyPlay's builder, so a run from
# main (the schedule, or by hand there) checks out the latest MyPlay release: a tip the Reviewer
# cleared (WF-2). Anything else builds the commit it was started on.
name: MyPlay speed limits

on:
  # Scheduled runs happen only from the default branch: this one fires once the file is there.
  schedule:
    - cron: "17 3 4 * *" # 03:17 UTC on the 4th of each month
  # By hand from the Actions page.
  workflow_dispatch:
  # When the builder or this file changes on the MyPlay branch: builds and tests only, never
  # publishes (WF-1: what drivers get is built from a reviewed tip, by hand or on schedule). This
  # trigger also makes GitHub know the workflow, so it can be run by hand.
  push:
    branches: [claude/myplay]
    paths:
      - "speedlimit/**"
      - ".github/workflows/myplay-speed-limits.yml"

permissions:
  contents: write

concurrency:
  group: myplay-speed-limits
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish the speed limit file
    runs-on: ubuntu-latest
    env:
      REGION: lithuania
      EXTRACT: https://download.geofabrik.de/europe/lithuania-latest.osm.pbf
      TAG: speed-limits
    steps:
      - name: Which code to build
        id: code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_REF" = refs/heads/main ]; then
            # The newest MyPlay release ("latest" is always an app release: speed-limits never is).
            ref=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            case "$ref" in
              myplay-v*) ;;
              *) echo "The latest release is \"$ref\", not a MyPlay release: not building." >&2; exit 1 ;;
            esac
          else
            ref="$GITHUB_SHA"
          fi
          echo "Building $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.code.outputs.ref }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
      - name: Test and build the file tool
        run: ./gradlew --no-daemon :speedlimit:test :speedlimit:installDist
      - name: Download the OpenStreetMap extract
        run: |
          mkdir -p work
          curl -fsSL --retry 3 -o work/region.osm.pbf "$EXTRACT"
          osmium fileinfo work/region.osm.pbf
      - name: Roads, with their points
        run: |
          osmium tags-filter work/region.osm.pbf w/highway -o work/roads.osm.pbf
          osmium add-locations-to-ways work/roads.osm.pbf -f opl -o work/roads.opl
      # Option A: the settlement areas, for the default limits of roads with none tagged (50 inside,
      # 90 outside, 70 unpaved; none on service roads), all marked "probably" (DEFAULTED).
      - name: Settlement areas
        run: |
          # SL-1: place points too (most Lithuanian villages are mapped as a point, not an area).
          osmium tags-filter work/region.osm.pbf nwr/place=city,town,village,hamlet \
            a/landuse=residential,commercial,retail,industrial -o work/areas.osm.pbf
          osmium export work/areas.osm.pbf -f geojsonseq --geometry-types=point,polygon \
            -x print_record_separator=false -o work/settlements.geojsonseq
          wc -l work/settlements.geojsonseq
      # How many roads of each class OpenStreetMap tags with a limit (the builder prints the same by
      # class, with what option A adds).
      - name: Coverage in the extract
        run: |
          osmium tags-count work/roads.osm.pbf -m 'highway=*' | sort -rn | head -20
          osmium tags-filter work/roads.osm.pbf w/maxspeed -o work/with-maxspeed.osm.pbf
          echo "with maxspeed:"
          osmium tags-count work/with-maxspeed.osm.pbf -m 'highway=*' | sort -rn | head -20
      - name: Build the files
        run: |
          tool=speedlimit/build/install/myplay-speedlimit/bin/myplay-speedlimit
          built="$(date -u +%F)"
          # SL-5: two files. speed-limits-<region>.bin as before (signed and kind limits only), for
          # apps that do not draw estimates; speed-limits-<region>-v2.bin with option A's estimates
          # (marked GUESSED), which only apps that draw them as "probably" fetch.
          "$tool" "$REGION" work/roads.opl out "$built"
          "$tool" "$REGION" work/roads.opl work/v2 "$built" work/settlements.geojsonseq
          mv "work/v2/speed-limits-$REGION.bin" "out/speed-limits-$REGION-v2.bin"
          mv "work/v2/speed-limits-$REGION.json" "out/speed-limits-$REGION-v2.json"
          ls -l out
          # A broken extract or a bug must not replace a good file with a nearly empty one.
          for f in "out/speed-limits-$REGION.bin" "out/speed-limits-$REGION-v2.bin"; do
            size=$(stat -c %s "$f")
            if [ "$size" -lt 200000 ]; then echo "$f is only $size bytes: not publishing." >&2; exit 1; fi
          done
      - name: Publish
        # WF-1: never from a push (unreviewed); only by hand or on schedule.
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > work/notes.md <<'EOF'
          Speed limit files for MyPlay, rebuilt once a month by `.github/workflows/myplay-speed-limits.yml`.
          The phone app downloads them (Settings, Speed limits); there is nothing to install by hand.

          The limits come from map data and may be wrong or out of date. The road signs always count.
          Where the map has no limit for a road, the -v2 file gives an estimate from Lithuania's rules of the
          road (50 in a settlement, 90 outside it, 70 on gravel), marked as "probably": it can be wrong,
          above all near the edge of a town or village.

          Map data © OpenStreetMap contributors, from Geofabrik's extract. These files are a database
          derived from OpenStreetMap and are available under the Open Database Licence (ODbL 1.0):
          https://www.openstreetmap.org/copyright. The code that builds them is in this repository
          (`speedlimit/`), under the GPL.
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
              --title "Speed limit files (map data)" --notes-file work/notes.md --prerelease --latest=false
          else
            # The notes say what the file holds now (SL-1: the estimates).
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file work/notes.md
          fi
          # The file first, then the manifest that describes it, so the phone never sees a manifest
          # for a file that is not there yet.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "out/speed-limits-$REGION.bin"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "out/speed-limits-$REGION.json"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "out/speed-limits-$REGION-v2.bin"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "out/speed-limits-$REGION-v2.json"
